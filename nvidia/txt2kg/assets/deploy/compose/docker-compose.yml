# txt2kg Docker Compose - Geode + Ollama (Default)
#
# Default stack tested and working on DGX Spark
#
# Usage:
#   ./start.sh                    # Default: Geode + Ollama
#
# For Geode + vLLM, use: ./start.sh --vllm

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/app/Dockerfile
    ports:
      - '3001:3000'
    environment:
      # Geode configuration (gRPC with server cert for TLS)
      - GEODE_URL=grpc://geode:50051?ca_cert=/geode-data/server.crt&insecure_tls_skip_verify=true
      - GEODE_USERNAME=geode
      - GEODE_PASSWORD=${GEODE_ADMIN_PASSWORD:-geodesic}
      - GRAPH_DB_TYPE=geode
      # Ollama configuration
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OLLAMA_MODEL=llama3.1:8b
      # Disable vLLM
      - VLLM_BASE_URL=http://localhost:8001/v1
      - VLLM_MODEL=disabled
      # Embeddings configuration
      - LANGCHAIN_TRACING_V2=true
      - SENTENCE_TRANSFORMER_URL=http://sentence-transformers:80
      - MODEL_NAME=all-MiniLM-L6-v2
      - EMBEDDINGS_API_URL=http://sentence-transformers:80
      # Other settings
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NODE_OPTIONS=--max-http-header-size=80000
      - UV_THREADPOOL_SIZE=128
      - HTTP_TIMEOUT=1800000
      - REQUEST_TIMEOUT=1800000
    volumes:
      - geode_data:/geode-data:ro
    networks:
      - default
      - txt2kg-network
    depends_on:
      geode:
        condition: service_healthy
      ollama:
        condition: service_started

  # Geode - Graph + Vector database
  geode:
    build:
      context: ../../../../../../geode
      dockerfile: Dockerfile
    container_name: geode
    command: ["--data-dir", "/data", "--listen-grpc", "0.0.0.0:50051"]
    ports:
      - '3141:3141/udp'
      - '50051:50051'
    environment:
      - GEODE_ADMIN_PASSWORD=${GEODE_ADMIN_PASSWORD:-geodesic}
    volumes:
      - geode_data:/data
    healthcheck:
      test: ["CMD-SHELL", "geode query 'RETURN 1 AS health' --server 127.0.0.1:3141 --insecure-tls-skip-verify -U geode -P \"$$GEODE_ADMIN_PASSWORD\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Ollama - Local LLM inference
  ollama:
    build:
      context: ../services/ollama
      dockerfile: Dockerfile
    image: ollama-custom:latest
    container_name: ollama-compose
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_GPU_LAYERS=-1
      - OLLAMA_LLM_LIBRARY=cuda_v13
    networks:
      - default
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Sentence Transformers - Embedding service
  sentence-transformers:
    build:
      context: ../services/sentence-transformers
      dockerfile: Dockerfile
    ports:
      - '8000:80'
    environment:
      - MODEL_NAME=all-MiniLM-L6-v2
    networks:
      - default
    restart: unless-stopped

volumes:
  geode_data:
  ollama_data:

networks:
  default:
    driver: bridge
  txt2kg-network:
    driver: bridge
