# Remote DGX cluster + celebrimbor encoder overlay.
# Usage: docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.remote-cluster.yml up -d
#
# - LLM triple extraction goes to a remote vLLM endpoint (Bearer auth via
#   VLLM_API_KEY — set it in the environment/.env, never commit it).
# - Embeddings go to a remote OpenAI-compatible /v1/embeddings endpoint
#   (EMBEDDINGS_API_FORMAT=openai selects the OpenAI request branch).
# - Local ollama and sentence-transformers services are disabled via profiles.
services:
  app:
    environment:
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://curumo.shire-altair.ts.net:8000/v1}
      - VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen3.8-27B}
      - VLLM_API_KEY=${VLLM_API_KEY}
      - OLLAMA_MODEL=disabled
      - EMBEDDINGS_API_URL=${EMBEDDINGS_API_URL:-https://celebrimbor.shire-altair.ts.net:8001}
      - EMBEDDINGS_API_FORMAT=openai
      - EMBEDDINGS_MODEL_ID=${EMBEDDINGS_MODEL_ID:-Qwen/Qwen3-Embedding-0.6B}
      - EMBEDDINGS_DIM=${EMBEDDINGS_DIM:-1024}
      # required by @geodedb/client for insecure_tls_skip_verify under NODE_ENV=production; dev deployment only
      - GEODE_ALLOW_INSECURE_PRODUCTION=true
    extra_hosts: []
    # Local ollama/sentence-transformers are profile-disabled below, so drop
    # the base file's dependency on ollama.
    depends_on: !override
      geode:
        condition: service_started
        restart: false

  # Disable local LLM/embedding services — remote endpoints replace them.
  ollama:
    profiles: ["disabled"]

  sentence-transformers:
    profiles: ["disabled"]
