# txt2kg Docker Compose - Geode + vLLM (GPU-accelerated)
#
# Optional stack optimized for DGX Spark/GB300 with unified memory support
#
# Usage:
#   ./start.sh --vllm                 # Use this compose file

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/app/Dockerfile
    ports:
      - '127.0.0.1:3001:3000'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      # Geode configuration (QUIC with server cert for TLS; gRPC serving was
      # removed from `geode serve` in v0.8.5 — JIRA ENG-3907)
      - GEODE_URL=quic://geode:3141?ca_cert=/geode-data/server.crt&insecure_tls_skip_verify=true
      - GEODE_USERNAME=geode
      - GEODE_PASSWORD=${GEODE_ADMIN_PASSWORD:-geodesic}
      - GRAPH_DB_TYPE=geode
      # vLLM configuration (GPU-accelerated)
      - VLLM_BASE_URL=http://vllm:8001/v1
      - VLLM_MODEL=nvidia/Llama-3_3-Nemotron-Super-49B-v1_5-FP8
      # Disable Ollama
      - OLLAMA_BASE_URL=http://localhost:11434/v1
      - OLLAMA_MODEL=disabled
      # Embeddings configuration
      - LANGCHAIN_TRACING_V2=true
      - SENTENCE_TRANSFORMER_URL=http://sentence-transformers:80
      - MODEL_NAME=all-MiniLM-L6-v2
      - EMBEDDINGS_API_URL=http://sentence-transformers:80
      # Other settings
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NODE_OPTIONS=--max-http-header-size=80000
      - UV_THREADPOOL_SIZE=128
      - HTTP_TIMEOUT=1800000
      - REQUEST_TIMEOUT=1800000
    volumes:
      - geode_data:/geode-data:ro
    networks:
      - default
      - txt2kg-network
    depends_on:
      geode:
        condition: service_healthy
      vllm:
        condition: service_started

  # Geode - Graph + Vector database
  geode:
    build:
      context: ../../../../../../geode
      dockerfile: Dockerfile
    container_name: geode
    # v0.8.5: `geode serve` no longer supports --listen-grpc (gRPC serving
    # removed — JIRA ENG-3907); QUIC on 3141 is the only listener.
    command: ["--data-dir", "/data", "--listen", "0.0.0.0:3141"]
    ports:
      - '127.0.0.1:3141:3141/udp'
    environment:
      - GEODE_ADMIN_PASSWORD=${GEODE_ADMIN_PASSWORD:-geodesic}
      # v0.8.5 release builds refuse --insecure-tls-skip-verify (used by the
      # healthcheck below) unless this env var is set.
      - GEODE_ALLOW_INSECURE_TLS=1
    volumes:
      - geode_data:/data
    healthcheck:
      test: ["CMD-SHELL", "geode query 'RETURN 1 AS health' --server 127.0.0.1:3141 --insecure-tls-skip-verify -U geode -P \"$$GEODE_ADMIN_PASSWORD\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # vLLM - GPU-accelerated LLM with unified memory support
  vllm:
    build:
      context: ../services/vllm
      dockerfile: Dockerfile
    container_name: vllm-service
    ports:
      - '127.0.0.1:8001:8001'
    # NOTE: VLLM_TENSOR_PARALLEL_SIZE=1 (single GPU, not tensor-parallel), so
    # ipc:host is not required for cross-process shared memory here; the
    # already-generous shm_size below covers vLLM's private-namespace
    # multiprocessing IPC needs. See docker-compose.yml (services/vllm) for a
    # multi-GPU-capable vLLM service where ipc:host was left in place
    # (NEEDS_HUMAN_JUDGMENT).
    ulimits:
      memlock: -1
      stack: 67108864
    shm_size: '16gb'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - VLLM_MODEL=nvidia/Llama-3_3-Nemotron-Super-49B-v1_5-FP8
      - VLLM_TENSOR_PARALLEL_SIZE=1
      - VLLM_MAX_MODEL_LEN=32768
      - VLLM_GPU_MEMORY_UTILIZATION=0.9
      - VLLM_MAX_NUM_SEQS=32
      - VLLM_MAX_NUM_BATCHED_TOKENS=32768
      - VLLM_KV_CACHE_DTYPE=auto
      - VLLM_PORT=8001
      - VLLM_HOST=0.0.0.0
      - CUDA_VISIBLE_DEVICES=0
      - NCCL_DEBUG=INFO
      - CUDA_MANAGED_FORCE_DEVICE_ALLOC=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - VLLM_CPU_OFFLOAD_GB=0
    volumes:
      - vllm_models:/app/models
      - /tmp:/tmp
      - ~/.cache/huggingface:/root/.cache/huggingface
    networks:
      - default
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 60s
      timeout: 30s
      retries: 30
      start_period: 1800s

  # Sentence Transformers - Embedding service
  sentence-transformers:
    build:
      context: ../services/sentence-transformers
      dockerfile: Dockerfile
    ports:
      # NOTE: container listens on privileged port 80 by design (see commit
      # 917677b, "Privileged Ports Mapped In Container" finding) - the
      # process binds via setcap CAP_NET_BIND_SERVICE as a non-root user, so
      # this host:container mapping is intentionally left unchanged. Several
      # other compose files and the frontend client reference this port.
      - '127.0.0.1:8000:80'
    environment:
      - MODEL_NAME=all-MiniLM-L6-v2
    networks:
      - default
    restart: unless-stopped
    # cap_drop ALL, but re-add NET_BIND_SERVICE: this service binds gunicorn
    # to privileged port 80 as non-root via setcap on the python3
    # interpreter (see commit 917677b); dropping NET_BIND_SERVICE entirely
    # would break that startup.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:80/health', timeout=5).status < 500 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  geode_data:
  vllm_models:

networks:
  default:
    driver: bridge
  txt2kg-network:
    driver: bridge
