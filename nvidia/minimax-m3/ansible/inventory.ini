# DGX Spark cluster serving MiniMax-M3 (REAP50 NVFP4) via sparkrun/SGLang.
# Head node first (it runs sparkrun, which launches containers on both nodes).
[head]
curumo ansible_host=10.0.0.26

[workers]
olorin ansible_host=10.0.0.180

[spark_cluster:children]
head
workers

[spark_cluster:vars]
ansible_user=benji
ansible_python_interpreter=/usr/bin/python3
