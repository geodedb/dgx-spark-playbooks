---
# Reproducible deployment of MiniMax-M3 (REAP50 NVFP4) serving across the
# olorin+curumo DGX Spark cluster via sparkrun/SGLang, with boot persistence.
#
#   ansible-playbook site.yml                 # full deploy (assumes model staged)
#   ansible-playbook site.yml --tags stage    # also download+sync the 121GB model
#   ansible-playbook site.yml --check         # dry run
#
- name: MiniMax-M3 DGX Spark serving (cluster-wide prerequisites + boot persistence)
  hosts: spark_cluster
  gather_facts: true
  roles:
    - role: minimax_m3
