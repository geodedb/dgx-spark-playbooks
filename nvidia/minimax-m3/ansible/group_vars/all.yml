---
# ── MiniMax-M3 (REAP50 NVFP4) DGX Spark serving — reproducible config ──────────
# All values here were validated live on the olorin+curumo GB10 cluster.

# Model / recipe
m3_recipe_name: minimax-m3-reap50
m3_model: sparkarena/Minimax-M3-v0-NVFP4-REAP50
m3_container: scitrera/dgx-spark-sglang-mm:v0   # multi-arch; sm_121 MSA + NVFP4 w13-scale patch

# Serving params
m3_port: 8000
m3_tensor_parallel: 2
m3_gpu_mem_util: "0.81"
# Engine derives 524288 (512K) as this build's max; 1048576 is REFUSED by SGLang
# ("incorrect outputs / CUDA errors") unless forced — so 512K is the safe ceiling.
m3_context_length: 524288
m3_max_num_batched_tokens: 8192

# Cluster topology (head first). The head runs sparkrun, which launches the
# worker container over SSH. These are the management-fabric (enP7s7, 10G) IPs.
m3_hosts: "10.0.0.26,10.0.0.180"
m3_head_ip: "10.0.0.26"

# The user that owns the HF model cache, the sparkrun ssh mesh, and uvx.
m3_run_user: benji
m3_hf_cache: "/home/{{ m3_run_user }}/.cache/huggingface"
m3_recipe_path: "/etc/minimax-m3/recipe.yaml"
m3_launch_wrapper: "/usr/local/sbin/spark-m3-launch"

# Proven GB10 multi-node NCCL config (mined from the working FSDP/vLLM stacks).
# Single persistent RoCE HCA on the 10.177.0.x DAC + GID v2 + mgmt-iface bootstrap.
m3_nccl_env:
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
  NCCL_SOCKET_IFNAME: "enP7s7"
  GLOO_SOCKET_IFNAME: "enP7s7"
  NCCL_IB_HCA: "rocep1s0f0"
  NCCL_IB_DISABLE: "0"
  NCCL_IB_GID_INDEX: "3"
  NCCL_NET_PLUGIN: "none"
  NCCL_IB_SUBNET_AWARE_ROUTING: "1"
  NCCL_IB_MERGE_NICS: "0"

# GB10 firmware-shutdown guard: pin GPU clocks during heavy inference.
gpu_clock_min: 200
gpu_clock_max: 2150

# Inter-node fabrics that NCCL/ssh/rsync use (for ufw allow rules).
m3_cluster_subnets:
  - "10.0.0.0/24"      # management fabric (enP7s7)
  - "10.177.0.0/30"    # CX-7 DAC point-to-point (RoCE)

# Host keys sparkrun's internal ssh must trust (head ssh's to these).
m3_ssh_keyscan_hosts:
  - "10.0.0.26"
  - "10.0.0.180"
  - "10.177.0.1"
  - "10.177.0.2"
