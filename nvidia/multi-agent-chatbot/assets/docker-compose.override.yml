# Override for DGX Spark (aarch64) testing
# - Uses pre-built Geode image
# - QUIC transport on 3141 (backend defaults). The former
#   GEODE_PORT=50051/GEODE_TRANSPORT=grpc workaround was removed: gRPC
#   serving no longer exists in geode v0.8.5 (JIRA ENG-3907).
# - UDP port-bound health check workaround (geode query hangs on aarch64 - #424)

services:
  backend:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/available_models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  geode:
    # Policy: test against geode:dev (latest fixes); use pinned releases only for production
    image: registry.gitlab.com/devnw/codepros/geode/geode:dev
    pull_policy: always
    build: !reset null
    # Check that the QUIC (UDP) port 3141 is bound (gRPC serving removed in
    # geode v0.8.5 — JIRA ENG-3907)
    healthcheck:
      test: ["CMD-SHELL", "ss -ulnp | grep -q ':3141'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
