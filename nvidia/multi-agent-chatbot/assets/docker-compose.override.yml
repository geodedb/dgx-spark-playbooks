# Override for DGX Spark (aarch64) testing
# - Uses pre-built Geode image
# - gRPC transport (QUIC TLS still hangs on aarch64 loopback - #424)
# - TCP health check workaround

services:
  backend:
    environment:
      - GEODE_PORT=50051
      - GEODE_TRANSPORT=grpc

  geode:
    image: geode:latest
    build: !reset null
    healthcheck:
      test: ["CMD-SHELL", "ss -tlnp | grep -q ':50051'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
