services:
  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      geode:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - GEODE_HOST=geode
      - GEODE_PORT=3141
      - GEODE_USERNAME=geode
      - GEODE_PASSWORD=${GEODE_ADMIN_PASSWORD:-geodesic}
      - MODELS=gpt-oss-120b #,gpt-oss-20b
    networks:
      - chatbot-net

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - /frontend:/app/frontend
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - chatbot-net

  geode:
    build:
      context: ../../../../geode
      dockerfile: Dockerfile
    container_name: geode
    command: ["--data-dir", "/data", "--listen-grpc", "0.0.0.0:50051"]
    ports:
      - '3141:3141/udp'
      - '50051:50051'
    environment:
      - GEODE_ADMIN_PASSWORD=${GEODE_ADMIN_PASSWORD:-geodesic}
    volumes:
      - geode_data:/data
    healthcheck:
      test: ["CMD-SHELL", "geode query 'RETURN 1 AS health' --server 127.0.0.1:3141 --insecure-tls-skip-verify -U geode -P \"$$GEODE_ADMIN_PASSWORD\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - chatbot-net

volumes:
  geode_data:

networks:
  chatbot-net:
    name: chatbot-net
