services:
  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      geode:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - GEODE_HOST=geode
      - GEODE_PORT=3141
      - GEODE_USERNAME=geode
      - GEODE_PASSWORD=${GEODE_ADMIN_PASSWORD:-geodesic}
      - MODELS=gpt-oss-120b #,gpt-oss-20b
    networks:
      - chatbot-net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/available_models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /frontend:/app/frontend
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - chatbot-net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  geode:
    build:
      context: ../../../../geode
      dockerfile: Dockerfile
    container_name: geode
    # v0.8.5: `geode serve` no longer supports --listen-grpc (gRPC serving
    # removed — JIRA ENG-3907); QUIC on 3141 is the only listener.
    command: ["--data-dir", "/data", "--listen", "0.0.0.0:3141"]
    ports:
      - '127.0.0.1:3141:3141/udp'
    environment:
      - GEODE_ADMIN_PASSWORD=${GEODE_ADMIN_PASSWORD:-geodesic}
      # v0.8.5 release builds refuse --insecure-tls-skip-verify (used by the
      # healthcheck below) unless this env var is set.
      - GEODE_ALLOW_INSECURE_TLS=1
    volumes:
      - geode_data:/data
    healthcheck:
      test: ["CMD-SHELL", "geode query 'RETURN 1 AS health' --server 127.0.0.1:3141 --insecure-tls-skip-verify -U geode -P \"$$GEODE_ADMIN_PASSWORD\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - chatbot-net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  geode_data:

networks:
  chatbot-net:
    name: chatbot-net
